[package]
name = "word-memory"
version = "1.0.0"
description = "高中必背 3600 词 · 背单词"
authors = ["XEYcmd"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "word_memory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
